# ShadowCarrier AP DHCP/DNS  (板端 /etc/dnsmasq.conf)
# 2026-10-14 [基建] 修复 dnsmasq 99.7% CPU (DNS 自环):
#   根因: systemd-resolved 已 disabled, 但 /etc/resolv.conf 仍为 nameserver 127.0.0.53;
#         dnsmasq 通配绑定 *:53 又以 127.0.0.53 作上游 → 查询转发给自己 → 死循环烧 CPU。
#   修复: no-resolv(不读 resolv.conf) + 显式真实上游 + bind-interfaces/listen-address
#         只绑 AP 地址, 双重杜绝自环。热点/DHCP/手机在场信号不受影响。
# 安装: sudo cp dnsmasq.conf /etc/dnsmasq.conf && sudo pkill dnsmasq && sudo dnsmasq -C /etc/dnsmasq.conf
interface=wlan0
bind-interfaces
listen-address=192.168.4.1
no-resolv
server=223.5.5.5
server=114.114.114.114
dhcp-range=192.168.4.2,192.168.4.50,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

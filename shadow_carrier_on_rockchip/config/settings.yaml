# Shadow Carrier 配置文件
# YAML格式，Python可直接读取

# --- 主人识别 ---
owner:
  bluetooth_mac: "04:34:C3:15:AE:0E"   # 主人手环 Xiaomi Smart Band 9（未连手机时公开广播）
  bt_rssi_threshold: -60                # RSSI大于此值才考虑
  color_similarity_threshold: 0.7       # HSV颜色直方图相似度阈值
  pose_similarity_threshold: 0.15       # 体态比允许误差范围

# --- 摄像头 ---
camera:
  device_id: 10                         # /dev/video10
  width: 1920
  height: 1080
  fourcc: "MJPG"

# --- YOLO ---
yolo:
  bin: "../shopping_car_vision/rknn_model_zoo/examples/yolov8/cpp/build/rknn_yolov8_demo"
  model: "../shopping_car_vision/rknn_model_zoo/examples/yolov8/cpp/build/model/yolov8.rknn"
  labels: "../shopping_car_vision/rknn_model_zoo/examples/yolov8/cpp/build/model/coco_80_labels_list.txt"
  conf_threshold: 0.25
  target_classes: ["person"]            # 我们只关心人

# --- 跟踪 ---
tracking:
  iou_threshold: 0.3                    # IOU匹配阈值
  max_lost_frames: 30                   # 丢多少帧后重新标定
  feature_pool_max_size: 500            # 特征池最大样本数

# --- 决策 ---
decision:
  scan_timeout_ms: 60000                # 开机60秒内必须锁定主人
  bt_only_duration_ms: 120000           # 前2分钟蓝牙占主导
  reidentify_timeout_ms: 5000           # 跟踪丢失5秒后触发重标定

# --- ESP32通信 ---
esp32:
  port: "/dev/ttyUSB0"                  # ESP32串口（可能改为ttyS0）
  baudrate: 115200
  protocol: "binary"                    # 二进制协议或文本协议

# --- 电机控制 ---
motor:
  max_speed: 0.5                        # 最大速度 m/s
  turn_rate: 1.0                        # 转向速率 rad/s
  follow_distance: 1.0                  # 跟随距离 米
  pid_kp: 0.8
  pid_ki: 0.1
  pid_kd: 0.05
